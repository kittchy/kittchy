<svg xmlns="http://www.w3.org/2000/svg" width="70" height="40" viewBox="0 0 70 40"><style>.in{animation:in .7s cubic-bezier(.2,.7,.2,1) both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.beat{transform-box:fill-box;transform-origin:50% 100%;animation:beat 1.2s ease-in-out infinite}@keyframes beat{0%,100%{transform:scaleY(.3)}25%{transform:scaleY(1)}50%{transform:scaleY(.55)}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-out .2s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.in,.beat,.pulse,.draw{animation:none}.draw{stroke-dashoffset:0}}</style><g class="in" style="animation-delay:0.40s"><rect width="70" height="40" rx="20" fill="#237C85"/><path d="M19.7 26 23.6 20.2 20.1 15H22.6L25 18.7H25.1L27.5 15H29.9L26.3 20.2L30.3 26H27.8L25 21.8H24.9L22.1 26Z" fill="#FFFFFF"/><path d="M38.5 20H50.5M46.0 15.5L50.5 20L46.0 24.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></svg>